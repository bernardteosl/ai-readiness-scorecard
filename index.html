<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Find out in 5 minutes if your business is using AI safely, and get a plain-English fix list. Your answers never leave your browser.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI Readiness &amp; Risk Scorecard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* The audit sheet: navy ink on paper, IBM Plex, a seven-colour rainbow for grades (flat colours, no gradients). */
:root{
  --paper:#E4E9E6; --surface:#FBFBF8; --ink:#17233A; --muted:#56627A; --line:#C7D2DF; --soft:#EDF0EE;
  --accent:#14619E; --accent-ink:#FFFFFF; --accent-soft:#E3EEF8;
  --cta:#F57C1F; --cta-ink:#17233A; --headline:#3236A8;
  --bar:#17233A; --bar-ink:#E8ECF2; --bar-muted:#9FAAC0; --bar-line:#3A4862; --bar-brand:#F6C31C;
  --good:#14619E; --warn:#8C6A00; --crit:#B3241C;
  --good-soft:#E3EEF8; --warn-soft:#FBF3D6; --crit-soft:#FBE6E3;
  /* grades: bright fill for blocks and bars, darker ink for text on paper */
  --g1:#E5352B; --g1-ink:#B3241C; --g2:#F57C1F; --g2-ink:#B65310; --g3:#F6C31C; --g3-ink:#8C6A00;
  --g4:#2DB35D; --g4-ink:#1C7A3D; --g5:#1F8FE5; --g5-ink:#14619E; --g6:#4B4FD8; --g6-ink:#3236A8;
  --g7:#8E3FD1; --g7-ink:#6B2AA3;
  --f-display:"IBM Plex Serif", Georgia, serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B1018; --surface:#141B27; --ink:#E6EAF0; --muted:#9AA6B8; --line:#2A3546; --soft:#1B2433;
  --accent:#6FB2F0; --accent-ink:#0B1018; --accent-soft:#16283C;
  --cta:#F78A3A; --cta-ink:#17233A; --headline:#A9ACF7;
  --bar:#070B11; --bar-ink:#E8ECF2; --bar-muted:#8D98AE; --bar-line:#2A3546; --bar-brand:#F6C31C;
  --good:#6FB2F0; --warn:#E8C04A; --crit:#F07A65;
  --good-soft:#16283C; --warn-soft:#332A0E; --crit-soft:#3A1D18;
  --g1-ink:#F07A65; --g2-ink:#F7A15C; --g3-ink:#F2CE4E; --g4-ink:#5CCB85; --g5-ink:#6FB2F0; --g6-ink:#A9ACF7; --g7-ink:#C59AF0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1018; --surface:#141B27; --ink:#E6EAF0; --muted:#9AA6B8; --line:#2A3546; --soft:#1B2433;
  --accent:#6FB2F0; --accent-ink:#0B1018; --accent-soft:#16283C;
  --cta:#F78A3A; --cta-ink:#17233A; --headline:#A9ACF7;
  --bar:#070B11; --bar-ink:#E8ECF2; --bar-muted:#8D98AE; --bar-line:#2A3546; --bar-brand:#F6C31C;
  --good:#6FB2F0; --warn:#E8C04A; --crit:#F07A65;
  --good-soft:#16283C; --warn-soft:#332A0E; --crit-soft:#3A1D18;
  --g1-ink:#F07A65; --g2-ink:#F7A15C; --g3-ink:#F2CE4E; --g4-ink:#5CCB85; --g5-ink:#6FB2F0; --g6-ink:#A9ACF7; --g7-ink:#C59AF0;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-0.015em;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--bar-line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.mark{width:26px;height:26px;border-radius:4px;border:1.5px solid var(--bar-ink);display:grid;place-items:center}
.brand-name{color:var(--bar-brand)}
.mark svg{display:block}
.brand small{display:block;font-weight:400;color:var(--bar-muted);font-size:12px;line-height:1.2}
.steps{display:flex;gap:0;list-style:none;margin:0;padding:0;flex-wrap:wrap;border:1px solid var(--bar-line);border-radius:4px;overflow:hidden}
.steps li + li button{border-left:1px solid var(--bar-line)}
.steps button{border:none;background:none;border-radius:0;padding:5px 11px;font-family:var(--f-mono);font-size:11.5px;color:var(--bar-ink);cursor:pointer;display:flex;gap:6px;align-items:center}
.steps button .n{font-family:var(--f-mono);font-size:11px}
.steps button[aria-current="step"]{background:var(--bar-ink);color:var(--bar)}
.steps button:disabled{opacity:.45;cursor:default}
.steps button:not(:disabled):not([aria-current="step"]):hover{background:var(--bar-line)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.narrow{max-width:640px}

.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);font-size:17px;max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:3px;padding:11px 18px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--cta-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--muted)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

/* landing: the audit sheet */
.wrap.wide{max-width:1080px}
.resume{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border-radius:4px;padding:12px 16px}
.sheet{background:var(--surface);box-shadow:0 1px 0 rgba(23,35,58,.08),0 18px 40px -18px rgba(23,35,58,.35)}
.rainbow{display:grid;grid-template-columns:repeat(7,1fr);height:6px}
.strip{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:2px solid var(--ink);padding:14px clamp(20px,5vw,56px);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.strip .m{color:var(--muted)}
.sh-body{display:grid;grid-template-columns:minmax(0,1fr) 360px}
.sh-left{padding:48px clamp(20px,5vw,56px) 52px;border-right:1px solid var(--line);min-width:0}
.sh-left h1{font-weight:500;font-size:clamp(38px,5.6vw,60px);line-height:1.04;letter-spacing:-0.02em;color:var(--headline)}
.sh-lead{font-size:18px;color:var(--muted);margin-top:22px;max-width:52ch;text-wrap:balance;hyphens:none}
.checks{list-style:none;margin:34px 0 0;padding:0;border-top:1px solid var(--line)}
.checks li{display:grid;grid-template-columns:28px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.box{width:20px;height:20px;border:1.5px solid var(--ink);margin-top:3px;position:relative}
.box::after{content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(42deg)}
.checks b{font-weight:600;display:block}
.checks span{display:block;color:var(--muted);font-size:14.5px}
.checks li:nth-child(1) b{color:var(--g5-ink)}
.checks li:nth-child(2) b{color:var(--g1-ink)}
.checks li:nth-child(3) b{color:var(--g4-ink)}
.sh-act{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-top:34px}
.sh-act .btn.primary{padding:14px 24px}
.textlink{background:none;border:none;padding:0;font:inherit;font-weight:600;color:var(--g5-ink);text-decoration:underline;text-decoration-color:var(--g5);text-underline-offset:4px;cursor:pointer}
.sh-right{padding:40px 36px;background:repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px);background-position:0 8px;min-width:0}
.sh-right .tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface);display:inline-block;padding-right:8px}
.stamp{width:200px;height:200px;margin:28px auto 30px;border:3px solid currentColor;border-radius:50%;display:grid;place-items:center;transform:rotate(-8deg);box-shadow:inset 0 0 0 6px var(--surface),inset 0 0 0 7.5px currentColor}
.stamp div{text-align:center;line-height:1}
.stamp b{display:block;font-family:var(--f-display);font-size:76px;font-weight:600;letter-spacing:-0.04em}
.stamp small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.stamp em{display:block;font-style:normal;font-family:var(--f-mono);font-size:12.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:10px;padding-top:8px;border-top:1.5px solid currentColor}
.ledger{list-style:none;margin:0;padding:0;background:var(--surface)}
.ledger li{display:flex;align-items:baseline;gap:8px;height:32px;font-size:14px}
.ledger .dots{flex:1;border-bottom:1.5px dotted var(--muted);opacity:.6;transform:translateY(-4px)}
.ledger .lchip{width:22px;height:10px;border-radius:2px;flex:none;align-self:center}
.ledger .v{font-family:var(--f-mono);font-weight:600;min-width:22px;text-align:right}
.gkey{background:var(--surface);margin-top:28px;padding-top:4px}
.gkey-h{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gscale{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px}
.gscale span{height:26px;border-radius:2px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;color:#fff}
.gscale span:nth-child(3){color:#3A2C00}
.gbands{display:grid;grid-template-columns:2fr 2fr 3fr;gap:3px;margin-top:6px;font-size:11.5px;font-weight:600}
.gbands span{border-top:2px solid;padding-top:4px}
.gbands span:nth-child(1){color:var(--g1-ink);border-color:var(--g1)}
.gbands span:nth-child(2){color:var(--g3-ink);border-color:var(--g3)}
.gbands span:nth-child(3){color:var(--g5-ink);border-color:var(--g5)}
.register{border-top:2px solid var(--ink);padding:28px clamp(20px,5vw,56px) 44px}
.register h2{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.register table{width:100%;border-collapse:collapse;margin-top:14px}
.register td{padding:13px 0;border-top:1px solid var(--line);vertical-align:baseline}
.register tr:last-child td{border-bottom:1px solid var(--line)}
.register td.code{width:84px;font-family:var(--f-mono);font-size:13px;font-weight:600}
.register td.nm{width:300px;font-family:var(--f-display);font-size:19px;font-weight:500;padding-right:16px}
.register td.bl{color:var(--muted)}
.foot{padding:16px clamp(20px,5vw,56px) 22px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:10px}
.foot .m{font-family:var(--f-mono)}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lbl{font-weight:600;font-size:14.5px}
.field .opt{font-weight:400;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 14px;width:100%}
.choice-row{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14.5px}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.form{display:grid;gap:22px}

/* quiz */
.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.track .seg{display:flex;flex-direction:column;gap:6px;min-width:0}
.track .bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.track .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.track .seg span{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .seg.on span{color:var(--ink);font-weight:600}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.qtitle{font-size:clamp(23px,3.4vw,30px)}
.hint-btn{background:none;border:none;color:var(--accent);font-weight:600;padding:0;cursor:pointer;font-size:14px}
.hint{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14.5px;color:var(--ink)}
.options{display:grid;gap:10px}
.option{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;width:100%}
.option:hover{border-color:var(--muted)}
.option .k{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.option[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.option[aria-checked="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.option.na{border-style:dashed}
.qnav{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.kbd{font-size:12.5px;color:var(--muted)}

/* results */
.res-top{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center}
.res-top > *{min-width:0}
.gauge svg{width:100%;height:auto;display:block}
.band-pill{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-family:var(--f-display);font-size:18px;padding:6px 14px;border-radius:999px}
.band-good{background:var(--good-soft);color:var(--good)}
.band-warn{background:var(--warn-soft);color:var(--warn)}
.band-crit{background:var(--crit-soft);color:var(--crit)}
.alert{border:1px solid var(--crit);background:var(--crit-soft);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.alert h3{font-size:16px;color:var(--crit);font-family:var(--f-body);font-weight:600;letter-spacing:0}
.alert ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.dlist{display:grid;gap:14px}
.drow{display:grid;grid-template-columns:minmax(0,190px) 1fr 52px;gap:14px;align-items:center}
.drow .nm{font-weight:600;font-size:14.5px}
.drow .nm small{display:block;font-weight:400;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.dbar{position:relative;height:12px;border-radius:6px;background:var(--soft)}
.dbar i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.dbar .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.drow .val{text-align:right;font-family:var(--f-mono);font-weight:600}
.legend{display:block;max-width:420px}

/* plan */
.acts{display:grid;gap:12px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 18px 20px;display:grid;gap:8px;position:relative;overflow:hidden}
.act::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--line)}
.act.p-crit::before{background:var(--crit)}
.act.p-fix::before{background:var(--warn)}
.act.p-imp::before{background:var(--accent)}
.act-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.act h3{font-size:18px}
.act .why{color:var(--muted);font-size:14.5px}
.act ol{margin:4px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14.5px}
.act .meta{display:flex;gap:6px;flex-wrap:wrap}
.act .qref{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.locked{position:relative}
.locked .blur{filter:blur(5px);user-select:none;pointer-events:none;opacity:.7}
.unlock{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:var(--ink);color:var(--paper);border-radius:14px;padding:24px}
.unlock > *{min-width:0}
.unlock h2{font-size:24px;color:var(--paper)}
.unlock p{color:color-mix(in srgb,var(--paper) 78%,transparent);font-size:14.5px}
.unlock ul{margin:10px 0 0;padding-left:18px;font-size:14.5px;color:color-mix(in srgb,var(--paper) 85%,transparent)}
.code-box{display:grid;gap:8px;min-width:240px}
.code-box input{background:var(--paper);color:var(--ink);border:none;border-radius:10px;padding:11px 14px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.code-box .err{color:var(--crit);font-size:13px;background:var(--crit-soft);border-radius:8px;padding:6px 10px}
.code-box small{font-size:12.5px;color:color-mix(in srgb,var(--paper) 70%,transparent)}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.week{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:8px;align-content:start}
.week .mono{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.week ul{margin:0;padding-left:16px;font-size:14px;display:grid;gap:4px}
.week .empty{font-size:13.5px;color:var(--muted)}

/* report */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:40px clamp(18px,5vw,48px);display:grid;gap:28px}
.doc-cover{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:20px}
.doc-cover h1{font-size:clamp(26px,4vw,34px)}
.doc-score{text-align:right}
.doc-score .big{font-family:var(--f-mono);font-size:48px;font-weight:600;line-height:1}
.doc h2{font-size:20px;margin-bottom:10px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.disclaimer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.18)}

@media (max-width:760px){
  .hero,.res-top,.unlock{grid-template-columns:1fr}
  .res-top .gauge{max-width:260px}

 {id:"DP1",d:"DP",w:3,crit:true,q:"What kind of information do staff put into AI tools?",

 {id:"DP2",d:"DP",w:2,q:"Do you know where your sensitive data lives?",

 {id:"DP3",d:"DP",w:2,q:"Do you remove or mask personal details before using AI?",

 {id:"AC1",d:"AC",w:3,crit:true,q:"Which accounts do staff use for AI tools?",

 {id:"TV1",d:"TV",w:2,q:"Do you have a list of approved AI tools?",

  fix:{t:"Publish an approved AI tools list",why:"A short approved list stops “shadow AI” and makes training and support easier.",steps:["Write down the AI tools in use today and approve 2–4 of them.","Say what each is approved for, e.g. drafting emails but not customer data.","Set a simple request route for new tools."],e:"quick",c:"free"}},
 {id:"TV2",d:"TV",w:2,q:"Do you check a tool’s privacy and security terms before adopting it?",

 {id:"TV3",d:"TV",w:1,q:"Do you know which AI browser extensions, plugins and connected apps are in use?",

  fix:{t:"Audit AI extensions and connected apps",why:"Extensions and app connections can quietly read email, files and browsing.",steps:["Ask staff to list the AI browser extensions they use.","Check connected apps in your Google Workspace or Microsoft 365 admin console.","Remove anything unapproved or unused."],e:"short",c:"free"}},
 {id:"PG1",d:"PG",w:3,crit:true,q:"Do you have a written AI usage policy?",

 {id:"PG2",d:"PG",w:2,q:"Is someone responsible for AI decisions and risks?",

 {id:"PG3",d:"PG",w:2,q:"Do you know which data protection laws apply to your AI use?",

 {id:"PS3",d:"PS",w:1,q:"Do staff know who to ask before trying a new AI tool?",

 {id:"OO2",d:"OO",w:1,q:"Do your automations (n8n, Zapier, Make) have logs and error alerts?",

  fix:{t:"Add logging and alerts to automations",why:"Silent failures can send wrong data to customers or drop orders for weeks.",steps:["Turn on execution logs in your automation tool.","Send error alerts to an email or chat channel someone checks.","Give every automation a named owner."],e:"short",c:"free"}},

/* ---------- STATE ---------- */
const fresh = () => ({screen:"landing", profile:{businessName:"",industry:"",teamSize:"",aiStage:""}, answers:{}, current:0, unlocked:false, startedAt:null, completedAt:null, sample:false});
let S = fresh(), saved = null;
try { const raw = localStorage.getItem(KEY); if (raw) saved = JSON.parse(raw); } catch(e) {}
if (saved && saved.answers) { S = Object.assign(fresh(), saved, {screen:"landing"}); }
/* Coming back from the product page (index.html#plan): reopen the action plan if the assessment is complete. */
if (location.hash === "#plan" && Q.every(q => q.id in S.answers)) { S.screen = "plan"; }

let ui = {hint:false, codeErr:"", resetArm:false};

/* ---------- SCORING ---------- */
function compute(answers){
  const domains = DOMAINS.map(d => {
    let got=0, max=0;
    Q.filter(q=>q.d===d.id).forEach(q=>{ const a=answers[q.id]; if (typeof a==="number"){ got+=a*q.w; max+=3*q.w; } });
    return {...d, score: max ? Math.round(got/max*100) : null};
  });
  const scored = domains.filter(d=>d.score!==null);
  const overall = scored.length ? Math.round(scored.reduce((s,d)=>s+d.score,0)/scored.length) : 0;
  const criticalGaps = Q.filter(q=>q.crit && answers[q.id]===0);
  let band = overall>=70 ? "good" : overall>=40 ? "warn" : "crit";
  const capped = band==="good" && criticalGaps.length>0;
  if (capped) band = "warn";
  const actions = Q.filter(q=>typeof answers[q.id]==="number" && answers[q.id]<=2).map(q=>{
    const a=answers[q.id];
    return {q, a, kind: a<=1 ? "fix":"improve", pri:(3-a)*q.w + (q.crit && a<=1 ? 10:0), critGap:q.crit && a===0};
  }).sort((x,y)=> y.pri-x.pri || (x.q.fix.e==="quick"?0:1)-(y.q.fix.e==="quick"?0:1));
  return {domains, overall, band, capped, criticalGaps, actions};
}
const BAND = {
  good:{name:"Ready", head:"Strong foundations. Keep them maintained."},
  warn:{name:"Getting there", head:"Some good habits, with gaps worth closing."},
  crit:{name:"At risk", head:"Your AI use is likely exposing data today."}
};
const bandOf = s => s===null ? "na" : s>=70 ? "good" : s>=40 ? "warn" : "crit";
const colorOf = b => b==="good" ? "var(--good)" : b==="warn" ? "var(--warn)" : b==="crit" ? "var(--crit)" : "var(--line)";
/* Seven rainbow grades inside the three bands: 0-19 red, 20-39 orange (At risk); 40-54 yellow, 55-69 green (Getting there); 70-79 blue, 80-89 indigo, 90-100 violet (Ready). */
const gradeOf = s => s===null ? 0 : s<20 ? 1 : s<40 ? 2 : s<55 ? 3 : s<70 ? 4 : s<80 ? 5 : s<90 ? 6 : 7;
const gFill = s => gradeOf(s) ? `var(--g${gradeOf(s)})` : "var(--line)";
const gInk = s => gradeOf(s) ? `var(--g${gradeOf(s)}-ink)` : "var(--muted)";

const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function copy(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }

}
async function sha256(t){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
const today = () => new Date().toLocaleDateString("en-SG",{day:"numeric",month:"long",year:"numeric"});

function gauge(score, band){
  const L = Math.PI*80, v = L*score/100;
  const pt = (p,r)=>[100 - r*Math.cos(Math.PI*p), 104 - r*Math.sin(Math.PI*p)];
  const tick = p => { const [x1,y1]=pt(p,68), [x2,y2]=pt(p,92); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--muted)" stroke-width="1.2"/>`; };
  return `<svg viewBox="0 0 200 128" role="img" aria-label="Overall score ${score} out of 100">
    <path d="M20 104 A80 80 0 0 1 180 104" fill="none" stroke="var(--soft)" stroke-width="14" stroke-linecap="round"/>
    <path d="M20 104 A80 80 0 0 1 180 104" fill="none" stroke="${gFill(score)}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${v.toFixed(1)} ${L.toFixed(1)}"/>
    ${tick(.4)}${tick(.7)}
    <text x="100" y="96" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="40" fill="var(--ink)">${score}</text>
    <text x="100" y="118" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="var(--muted)">out of 100</text>
    <text x="20" y="124" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--muted)">0</text>
    <text x="180" y="124" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--muted)">100</text>
  </svg>`;
}

/* ---------- SCREENS ---------- */
const STEP_LIST = [["landing","Start"],["profile","Profile"],["quiz","Questions"],["results","Results"],["plan","Action plan"],["report","Report"]];

  return `
  ${resume ? `<div class="resume"><span><b>Continue where you left off.</b> ${answeredCount()} of ${Q.length} questions answered.</span><button class="btn primary" data-act="resume">Continue</button></div>`:""}

  <article class="sheet">

    <div class="sh-body">

        <ul class="checks">
          <li><span class="box" aria-hidden="true"></span><div><b>A score out of 100</b><span>See how you rate across six areas, from data protection to staff skills.</span></div></li>

          <li><span class="box" aria-hidden="true"></span><div><b>A prioritised fix list</b><span>Quick wins first, with effort and cost for every fix.</span></div></li>
        </ul>
        <div class="sh-act"><button class="btn primary" data-act="start">Start free check</button><button class="textlink" data-act="sample">See a sample result</button></div>
      </section>
      <aside class="sh-right" aria-label="Sample result preview">
        <span class="tag">Sample result</span>
        <div class="stamp" style="color:${gInk(r.overall)};background:color-mix(in srgb, ${gFill(r.overall)} 16%, var(--surface))"><div><b>${r.overall}</b><small>out of 100</small><em>${BAND[r.band].name}</em></div></div>
        <ul class="ledger">${r.domains.map(d=>`<li>${esc(d.name)}<span class="dots"></span><span class="lchip" style="background:${gFill(d.score)}"></span><span class="v" style="color:${gInk(d.score)}">${d.score}</span></li>`).join("")}</ul>
        ${gradingKey()}
      </aside>
    </div>
    <section class="register">
      <h2>The six areas we check</h2>
      <table>${DOMAINS.map((d,i)=>`<tr><td class="code">${d.id}</td><td class="nm" style="color:var(--${rows[i]}-ink)">${esc(d.name)}</td><td class="bl">${esc(d.blurb)}</td></tr>`).join("")}</table>
    </section>
    <p class="foot"><span class="m">*</span><span>Your answers stay in this browser. Nothing is sent to us or anyone else. This is a self-assessment for awareness, not a security audit or legal advice.</span></p>
  </article>`;
}

function vProfile(){
  const p = S.profile, ok = p.industry && p.teamSize;
  const picks = (field, list) => `<div class="choice-row" role="group">${list.map(v=>`<button class="pick" data-pick="${field}" data-val="${esc(v)}" aria-pressed="${p[field]===v}">${esc(v)}</button>`).join("")}</div>`;
  return `<div class="narrow" style="display:grid;gap:24px">
    <div><p class="eyebrow">Step 2 of 6</p><h1 style="font-size:32px;margin-top:6px">About your business</h1><p class="lead" style="margin-top:8px">This tailors your report. It takes 30 seconds.</p></div>
    <form class="panel form" id="pform" novalidate>
      <div class="field"><label for="bname">Business name <span class="opt">(optional, only shown on your report)</span></label><input class="input" id="bname" autocomplete="organization" value="${esc(p.businessName)}" placeholder="e.g. Harbour Lane Studio"></div>
      <div class="field"><span class="lbl" id="l-ind">Industry</span>${picks("industry",INDUSTRIES)}</div>
      <div class="field"><span class="lbl">Team size</span>${picks("teamSize",SIZES)}</div>
      <div class="field"><span class="lbl">How do you use AI today? <span class="opt">(optional)</span></span>${picks("aiStage",STAGES)}</div>
      <div class="qnav"><button type="button" class="btn ghost" data-go="landing">← Back</button><button type="submit" class="btn primary" ${ok?"":"disabled"}>Start the questions</button></div>
      ${ok?"":`<p class="kbd" style="margin-top:-10px">Choose an industry and team size to continue.</p>`}
    </form></div>`;
}

function vQuiz(){
  const q = Q[S.current], d = DOMAINS.find(x=>x.id===q.d), a = S.answers[q.id];
  const segs = DOMAINS.map(dm=>{ const qs=Q.filter(x=>x.d===dm.id), n=qs.filter(x=>x.id in S.answers).length; return `<div class="seg ${dm.id===q.d?"on":""}"><div class="bar"><i style="width:${n/qs.length*100}%"></i></div><span>${dm.id} ${esc(dm.name)}</span></div>`; }).join("");
  const opts = q.o.map((t,i)=>`<button class="option" role="radio" aria-checked="${a===i}" data-ans="${i}"><span class="k">${i+1}</span><span>${esc(t)}</span></button>`).join("")
    + (q.na ? `<button class="option na" role="radio" aria-checked="${a==="na"}" data-ans="na"><span class="k">–</span><span>${esc(q.na)} <span class="kbd">(not scored)</span></span></button>`:"");
  const last = S.current===Q.length-1;
  return `<div class="track" aria-label="Progress by area">${segs}</div>
  <div class="narrow" style="display:grid;gap:20px;width:100%;margin:0 auto">
    <div class="qhead"><span class="eyebrow">${esc(d.name)} · Question ${S.current+1} of ${Q.length}</span>${q.crit?`<span class="chip crit">Critical</span>`:""}</div>
    <h1 class="qtitle">${esc(q.q)}</h1>
    <div><button class="hint-btn" data-act="hint" aria-expanded="${ui.hint}">${ui.hint?"Hide explanation":"What does this mean?"}</button>${ui.hint?`<p class="hint" style="margin-top:8px">${esc(q.hint)}</p>`:""}</div>
    <div class="options" role="radiogroup" aria-label="${esc(q.q)}">${opts}</div>
    <div class="qnav">
      <button class="btn ghost" data-act="prev">← ${S.current===0?"Profile":"Back"}</button>
      <span class="kbd">Tip: press 1–4 to answer</span>
      <button class="btn primary" data-act="next" ${a===undefined?"disabled":""}>${last?"See my results":"Next →"}</button>
    </div>
  </div>`;
}

function vResults(){
  const r = compute(S.answers), name = S.profile.businessName;
  return `<div class="row" style="justify-content:space-between"><div><p class="eyebrow">Your results${name?` · ${esc(name)}`:""}</p><h1 style="font-size:32px;margin-top:6px">AI Readiness score</h1></div>${S.sample?`<span class="chip">Sample answers</span>`:""}</div>
  <section class="panel res-top">
    <div class="gauge">${gauge(r.overall, r.band)}</div>
    <div style="display:grid;gap:12px">
      <div><span class="band-pill band-${r.band}">${BAND[r.band].name}</span></div>
      <p style="font-size:19px;font-weight:600">${BAND[r.band].head}</p>
      <p class="kbd" style="font-size:14px">${r.capped?"Your score is in the Ready range, but a critical gap holds you at Getting there until it is fixed.":`You answered ${Q.length} questions across 6 areas. ${r.actions.filter(x=>x.kind==="fix").length} gaps need attention.`}</p>
      <div class="row"><button class="btn primary" data-go="plan">See my action plan →</button><button class="btn" data-act="share">Share my score</button></div>
    </div>
  </section>
  ${r.criticalGaps.length?`<section class="alert" role="alert"><h3>${r.criticalGaps.length} critical gap${r.criticalGaps.length>1?"s":""} found</h3><ul>${r.criticalGaps.map(q=>`<li><b>${q.id}</b> · ${esc(q.fix.t)}</li>`).join("")}</ul><p style="font-size:13.5px">Each of these can cause a data leak or customer harm on its own. They are at the top of your action plan.</p></section>`:""}
  <section class="panel" style="display:grid;gap:18px"><h2 style="font-size:20px">Score by area</h2>${domainBars(r.domains)}</section>
  <section class="panel row" style="justify-content:space-between"><div style="max-width:52ch"><b>Want help closing these gaps?</b><p class="kbd" style="font-size:14px;margin-top:4px">Book a 60-minute AI Safety Review. We go through your results together and leave you with a written fix plan.</p></div>${bookLink("Book a review")}</section>
  <div class="row" style="justify-content:space-between"><button class="btn ghost" data-act="edit">← Change my answers</button><button class="btn ghost" data-act="reset">${ui.resetArm?"Click again to clear all answers":"Start over"}</button></div>`;
}

function actCard(x, full){
  const cls = x.critGap ? "p-crit" : x.kind==="fix" ? "p-fix" : "p-imp";
  const tag = x.critGap ? `<span class="chip crit">Critical gap</span>` : x.kind==="fix" ? `<span class="chip warn">Fix</span>` : `<span class="chip accent">Improve</span>`;
  return `<article class="act ${cls}">
    <div class="act-h"><div><span class="qref">${x.q.id} · ${esc(DOMAINS.find(d=>d.id===x.q.d).name)}</span><h3>${esc(x.q.fix.t)}</h3></div>${tag}</div>
    <p class="why">${esc(x.q.fix.why)}</p>
    ${full?`<ol>${x.q.fix.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><div class="meta"><span class="chip">${EFFORT[x.q.fix.e]}</span><span class="chip">${COST[x.q.fix.c]}</span></div>`:""}
  </article>`;
}
function thirtyDay(actions){
  const fixes = actions.filter(a=>a.kind==="fix");
  const quick = fixes.filter(a=>a.q.fix.e==="quick"), shorts = fixes.filter(a=>a.q.fix.e==="short");
  const w = [quick.slice(0,4), [], [], []];
  shorts.forEach((a,i)=>w[1+(i%3)].push(a));
  quick.slice(4).forEach((a,i)=>w[1+(i%3)].push(a));
  const later = actions.filter(a=>a.kind==="improve");
  return `<div class="weeks">${w.map((list,i)=>`<div class="week"><span class="mono">Week ${i+1}</span>${list.length?`<ul>${list.map(a=>`<li>${esc(a.q.fix.t)}</li>`).join("")}</ul>`:`<span class="empty">Catch-up time</span>`}</div>`).join("")}</div>
  ${later.length?`<p class="kbd" style="font-size:14px">After day 30: ${later.length} “Improve” item${later.length>1?"s":""} to raise good habits to fully in place.</p>`:""}`;
}

function vPlan(){
  const r = compute(S.answers), fixes = r.actions.filter(a=>a.kind==="fix");
  if (!r.actions.length) return `<div class="panel"><h1 style="font-size:28px">Nothing to fix. Well done.</h1><p class="lead" style="margin-top:8px">Every area is fully in place. Re-run this check every six months, and whenever you add a new AI tool.</p></div>`;
  const head = `<div><p class="eyebrow">Step 5 of 6</p><h1 style="font-size:32px;margin-top:6px">Your action plan</h1><p class="lead" style="margin-top:8px">${fixes.length} fix${fixes.length===1?"":"es"} ranked by risk, critical gaps first and quick wins before bigger projects.</p></div>`;
  if (!S.unlocked){
    const free = fixes.slice(0,3), rest = r.actions.length - free.length;
    return `${head}
    <div class="acts">${free.map(x=>actCard(x,false)).join("")}</div>
    ${rest>0?`<div class="locked"><div class="blur acts" aria-hidden="true">${r.actions.slice(3,5).map(x=>actCard(x,true)).join("")}</div></div>`:""}
    <section class="unlock">
      <div><h2>Unlock the full report</h2><p style="margin-top:6px">Get step-by-step instructions for every fix${rest>0?`, plus ${rest} more item${rest>1?"s":""}`:""}.</p>
        <ul><li>Steps, effort and cost for each fix</li><li>A week-by-week 30-day plan</li><li>A report you can save and share with your team</li></ul></div>
      <form class="code-box" id="cform" novalidate>
        <a class="btn primary" href="buy.html">Buy full report · US$19</a>
        <label for="code" style="font-size:13px;margin-top:6px">Already bought? Enter your access code</label>
        <input id="code" autocomplete="off" spellcheck="false" placeholder="ACCESS CODE">
        ${ui.codeErr?`<span class="err" role="alert">${esc(ui.codeErr)}</span>`:""}
        <button class="btn" type="submit">Unlock</button>
      </form>
    </section>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" data-go="results">← Results</button>${bookLink("Book a review instead")}</div>`;
  }
  return `${head}
    <div class="acts">${r.actions.map(x=>actCard(x,true)).join("")}</div>
    <section class="panel" style="display:grid;gap:14px"><h2 style="font-size:20px">Your 30-day plan</h2>${thirtyDay(r.actions)}</section>
    <div class="row" style="justify-content:space-between"><button class="btn ghost" data-go="results">← Results</button><button class="btn primary" data-go="report">View full report →</button></div>`;
}

function reportText(){
  const r = compute(S.answers), p = S.profile;
  let t = `AI READINESS & RISK SCORECARD\n${p.businessName||"Your business"} · ${p.industry} · ${p.teamSize} staff\n${today()}\n\nOverall score: ${r.overall}/100 (${BAND[r.band].name})\n${BAND[r.band].head}\n\nSCORE BY AREA\n`;
  r.domains.forEach(d=> t+=`- ${d.name}: ${d.score===null?"n/a":d.score}\n`);
  if (r.criticalGaps.length){ t+=`\nCRITICAL GAPS\n`; r.criticalGaps.forEach(q=> t+=`- ${q.id}: ${q.fix.t}\n`); }
  t+=`\nACTION PLAN\n`;
  r.actions.forEach((x,i)=>{ t+=`\n${i+1}. ${x.q.fix.t} [${x.kind==="fix"?"Fix":"Improve"} · ${EFFORT[x.q.fix.e]} · ${COST[x.q.fix.c]}]\n   ${x.q.fix.why}\n`; x.q.fix.steps.forEach(s=> t+=`   - ${s}\n`); });
  t+=`\nThis is a self-assessment for awareness, not a security audit or legal advice.\nBloWeD Consulting`;
  return t;
}
function vReport(){
  const r = compute(S.answers), p = S.profile;
  return `<div class="row" style="justify-content:space-between"><div><p class="eyebrow">Step 6 of 6</p><h1 style="font-size:28px;margin-top:6px">Full report</h1></div><div class="row no-print"><button class="btn primary" data-act="print">Save as PDF</button><button class="btn" data-act="copyreport">Copy report text</button>${bookLink("Book a review")}</div></div>
  
  <article class="doc">
    <header class="doc-cover">
      <div><p class="eyebrow">AI Readiness &amp; Risk Report</p><h1 style="margin-top:6px">${esc(p.businessName||"Your business")}</h1><p class="kbd" style="font-size:14px;margin-top:6px">${esc(p.industry)} · ${esc(p.teamSize)} staff${p.aiStage?` · ${esc(p.aiStage)}`:""} · ${today()}</p></div>
      <div class="doc-score"><div class="big">${r.overall}</div><span class="band-pill band-${r.band}" style="font-size:15px;margin-top:8px">${BAND[r.band].name}</span></div>
    </header>
    <section><h2>Summary</h2><p>${BAND[r.band].head} ${r.criticalGaps.length?`There ${r.criticalGaps.length>1?"are":"is"} <b>${r.criticalGaps.length} critical gap${r.criticalGaps.length>1?"s":""}</b> to close first: ${r.criticalGaps.map(q=>esc(q.fix.t.toLowerCase())).join("; ")}.`:"No critical gaps were found."}</p></section>
    <section><h2>Score by area</h2><div class="tbl-wrap"><table><thead><tr><th>Area</th><th>Status</th><th style="text-align:right">Score</th></tr></thead><tbody>
      ${r.domains.map(d=>{const b=bandOf(d.score);return `<tr><td>${esc(d.name)}</td><td>${b==="na"?"Not scored":`<span class="chip ${b}">${BAND[b].name}</span>`}</td><td class="num" style="color:${gInk(d.score)};font-weight:600">${d.score??"n/a"}</td></tr>`;}).join("")}
    </tbody></table></div></section>
    <section><h2>Action plan</h2><div class="acts">${r.actions.map(x=>actCard(x,true)).join("")}</div></section>
    <section><h2>30-day plan</h2>${thirtyDay(r.actions)}</section>
    <p class="disclaimer">This report is a self-assessment for awareness. It is not a security audit, certification or legal advice. Answers were entered by the business and were not verified. Prepared with the AI Readiness &amp; Risk Scorecard by BloWeD Consulting.</p>
  </article>
  <div class="row" style="justify-content:space-between"><button class="btn ghost" data-go="plan">← Action plan</button><button class="btn ghost" data-act="reset">${ui.resetArm?"Click again to clear all answers":"Start a new assessment"}</button></div>`;
}

/* ---------- RENDER + EVENTS ---------- */
function go(screen){ if (!canGo(screen)) return; S.screen=screen; ui.hint=false; ui.codeErr=""; ui.resetArm=false; save(); render(); window.scrollTo({top:0}); }
function render(){
  const v = {landing:vLanding, profile:vProfile, quiz:vQuiz, results:vResults, plan:vPlan, report:vReport}[S.screen];
  $("#app").innerHTML = v(); $("#app").classList.toggle("wide", S.screen==="landing"); renderSteps();
  const pf=$("#pform"); if (pf) pf.addEventListener("submit", e=>{ e.preventDefault(); S.profile.businessName=$("#bname").value.trim(); if(!S.startedAt) S.startedAt=new Date().toISOString(); go("quiz"); });
  const bn=$("#bname"); if (bn) bn.addEventListener("input", e=>{ S.profile.businessName=e.target.value; save(); });
  const cf=$("#cform"); if (cf) cf.addEventListener("submit", async e=>{ e.preventDefault(); const v=$("#code").value.trim().toUpperCase(); if(!v){ ui.codeErr="Enter the code from your receipt email."; render(); return; }
    let ok=false; try{ ok = (await sha256(v))===CODE_HASH; }catch(_){ ok = false; }
    if(ok){ S.unlocked=true; ui.codeErr=""; save(); render(); toast("Full report unlocked."); } else { ui.codeErr="That code doesn’t match. Check your receipt email and try again."; render(); $("#code")?.focus(); } });
}
function answer(val){
  const q=Q[S.current]; S.answers[q.id]= val==="na" ? "na" : Number(val); save();
  if (S.current<Q.length-1){ render(); setTimeout(()=>{ if(S.screen==="quiz" && Q[S.current].id===q.id){ S.current++; ui.hint=false; save(); render(); } }, 260); }
  else render();
}
document.addEventListener("click", e=>{
  const g=e.target.closest("[data-go]"); if (g && !g.disabled){ go(g.dataset.go); return; }
  const pk=e.target.closest("[data-pick]"); if (pk){ const f=pk.dataset.pick, v=pk.dataset.val; S.profile[f] = S.profile[f]===v && f==="aiStage" ? "" : v; S.profile.businessName=$("#bname")?.value.trim()??S.profile.businessName; save(); render(); return; }
  const an=e.target.closest("[data-ans]"); if (an){ answer(an.dataset.ans); return; }
  const a=e.target.closest("[data-act]"); if (!a) return;
  const act=a.dataset.act;
  if (act!=="reset") ui.resetArm=false;
  if (act==="start"){ if (S.sample){ S=fresh(); } go("profile"); }
  else if (act==="resume"){ const i=Q.findIndex(q=>!(q.id in S.answers)); S.current=i<0?0:i; go(canGo("quiz")?"quiz":"profile"); }
  else if (act==="sample"){ S=Object.assign(fresh(), {profile:{...SAMPLE.profile}, answers:{...SAMPLE.answers}, sample:true, completedAt:new Date().toISOString()}); go("results"); }
  else if (act==="hint"){ ui.hint=!ui.hint; render(); }
  else if (act==="prev"){ if (S.current===0) go("profile"); else { S.current--; ui.hint=false; save(); render(); } }
  else if (act==="next"){ if (S.current<Q.length-1){ S.current++; ui.hint=false; save(); render(); } else { S.completedAt=new Date().toISOString(); go("results"); } }
  else if (act==="edit"){ S.current=0; go("quiz"); }
  else if (act==="share"){ const r=compute(S.answers); copy(`Our AI Readiness score: ${r.overall}/100 (${BAND[r.band].name}). How safely is your business using AI? Take the free 5-minute check:`, "Copied. Paste it into your Threads post."); }
  else if (act==="print"){ window.print(); }
  else if (act==="copyreport"){ copy(reportText(), "Report copied as text."); }
  else if (act==="reset"){ if (!ui.resetArm){ ui.resetArm=true; render(); } else { S=fresh(); try{ localStorage.removeItem(KEY); }catch(_){} ui.resetArm=false; render(); window.scrollTo({top:0}); toast("All answers cleared from this browser."); } }
});
document.addEventListener("keydown", e=>{
  if (S.screen!=="quiz" || e.target.matches("input,textarea")) return;
  const q=Q[S.current];
  if (/^[1-4]$/.test(e.key)) answer(Number(e.key)-1);
  else if (e.key==="0" && q.na) answer("na");
});
render();
</script>

</body>
</html>
